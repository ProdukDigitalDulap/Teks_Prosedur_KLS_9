                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${item.rows.map((r, rIdx) => `
                    <tr class="hover:bg-slate-50">
                      <td class="p-2.5 text-center font-bold text-slate-500">${rIdx + 1}</td>
                      <td class="p-2.5 font-medium text-slate-800">${r.text}</td>
                      <td class="p-2.5 text-center">
                        <span class="px-2 py-1 rounded font-black text-[11px] ${r.key === 'Benar' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}">${r.key}</span>
                      </td>
                      <td class="p-2.5 text-[11px] text-slate-500 italic">${r.reason}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        }

        // Analysis section for options
        let optionDetailsHTML = "";
        if (item.explanation.optionAnalysis && item.explanation.optionAnalysis.length > 0) {
          optionDetailsHTML = `
            <div class="mt-4 pt-3 border-t border-slate-200">
              <h5 class="text-xs font-black uppercase tracking-wider text-slate-700 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-code-compare text-blue-600"></i> Bedah & Relevansi Setiap Opsi Jawaban:
              </h5>
              <div class="space-y-2">
                ${item.explanation.optionAnalysis.map(oa => `
                  <div class="p-2.5 rounded-xl border text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 ${
                    oa.status === 'BENAR' ? 'bg-emerald-50 border-emerald-200 text-emerald-950' : 'bg-slate-50 border-slate-200 text-slate-700'
                  }">
                    <div class="font-bold flex items-center gap-2">
                      <span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-black ${oa.status === 'BENAR' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">
                        ${oa.status === 'BENAR' ? '✓' : '✗'}
                      </span>
                      <span>${oa.opt}</span>
                    </div>
                    <div class="text-[11px] sm:text-right ${oa.status === 'BENAR' ? 'text-emerald-800 font-semibold' : 'text-slate-500 italic'}">
                      ${oa.note}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <!-- Header Card -->
          <div class="bg-slate-50 p-4 sm:p-5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="w-9 h-9 rounded-2xl bg-slate-900 text-white font-display font-black text-sm flex items-center justify-center shadow-sm">
                ${item.id}
              </span>
              <div>
                <span class="text-xs font-black text-blue-700 block">${item.tpTitle}</span>
                <span class="text-[11px] font-bold text-slate-500">Stimulus: ${item.stimulusRef}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
              ${typeBadge}
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-purple-50 text-purple-700 border border-purple-200">${item.level}</span>
            </div>
          </div>

          <!-- Body Card: Soal & Opsi -->
          <div class="p-5 sm:p-6 space-y-4">
            <div>
              <span class="text-[10px] font-black uppercase tracking-wider text-slate-400 block mb-1">Pertanyaan Naskah Ujian:</span>
              <p class="font-display font-bold text-slate-900 text-base sm:text-lg leading-relaxed whitespace-pre-line">${item.question}</p>
            </div>

            <!-- Choices / Options -->
            ${choicesHTML}

            <!-- Expandable Teacher Note Box -->
            <div class="pt-2">
              <button type="button" onclick="toggleCardSpoiler(${item.id})" class="text-xs font-black text-blue-700 hover:text-blue-800 flex items-center gap-1.5 transition select-none">
                <i class="fa-solid fa-chevron-down transform transition-transform duration-200" id="chevron-q-${item.id}"></i>
                <span id="label-q-${item.id}">Tampilkan Analisis Ilmiah & Kunci Guru</span>
              </button>

              <div id="spoiler-q-${item.id}" class="hidden mt-3 p-4 sm:p-5 rounded-2xl bg-gradient-to-br from-slate-900 to-indigo-950 text-white text-xs space-y-3.5 border border-slate-800 shadow-inner">
                
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-2.5">
                  <div class="flex items-center gap-2">
                    <span class="text-amber-400 font-extrabold text-sm"><i class="fa-solid fa-key"></i> KUNCI:</span>
                    <span class="font-mono text-emerald-400 font-black text-sm bg-slate-950 px-2 py-0.5 rounded border border-slate-700">
                      ${Array.isArray(item.key) ? item.key.join(', ') : item.key}
                    </span>
                  </div>
                  <span class="text-[10px] text-slate-400 font-mono">Indikator: ${item.competency}</span>
                </div>

                <div>
                  <span class="text-[10px] font-black uppercase tracking-wider text-indigo-300 block mb-1">Landasan Bukti Pada Naskah & Konsep:</span>
                  <p class="text-slate-200 leading-relaxed text-xs">${item.explanation.mainConcept}</p>
                </div>

                ${optionDetailsHTML}

                <div class="p-3 bg-amber-950/40 border border-amber-500/30 rounded-xl text-amber-200 text-[11px] flex items-start gap-2.5">
                  <i class="fa-solid fa-lightbulb text-amber-400 text-sm mt-0.5 flex-shrink-0"></i>
                  <div>
                    <strong class="font-black text-amber-300 uppercase tracking-wide">Tips Remedial / Catatan Guru:</strong>
                    <p class="mt-0.5 leading-relaxed">${item.explanation.teacherTips}</p>
                  </div>
                </div>

              </div>
            </div>

          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleCardSpoiler(id) {
      const box = document.getElementById(`spoiler-q-${id}`);
      const icon = document.getElementById(`chevron-q-${id}`);
      const label = document.getElementById(`label-q-${id}`);

      if (box.classList.contains("hidden")) {
        box.classList.remove("hidden");
        icon.classList.add("rotate-180");
        label.textContent = "Sembunyikan Analisis & Kunci Guru";
      } else {
        box.classList.add("hidden");
        icon.classList.remove("rotate-180");
        label.textContent = "Tampilkan Analisis Ilmiah & Kunci Guru";
      }
    }

    function toggleAllExplanations() {
      isAllExpanded = !isAllExpanded;
      const allBoxes = document.querySelectorAll('[id^="spoiler-q-"]');
      const allIcons = document.querySelectorAll('[id^="chevron-q-"]');
      const allLabels = document.querySelectorAll('[id^="label-q-"]');

      allBoxes.forEach(b => {
        if (isAllExpanded) b.classList.remove("hidden");
        else b.classList.add("hidden");
      });

      allIcons.forEach(i => {
        if (isAllExpanded) i.classList.add("rotate-180");
        else i.classList.remove("rotate-180");
      });

      allLabels.forEach(l => {
        l.textContent = isAllExpanded 
          ? "Sembunyikan Analisis & Kunci Guru" 
          : "Tampilkan Analisis Ilmiah & Kunci Guru";
      });

      document.getElementById("toggleAllLabel").textContent = isAllExpanded 
        ? "Tutup Semua Pembahasan" 
        : "Buka Semua Pembahasan";
    }

    function filterByTP(tpKey) {
      currentFilterTP = tpKey;
      document.querySelectorAll(".tp-btn").forEach(btn => {
        btn.className = "tp-btn px-3 py-1.5 rounded-lg font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
      });
      document.getElementById(`btn-tp-${tpKey}`).className = "tp-btn px-3 py-1.5 rounded-lg font-extrabold bg-blue-600 text-white transition";
      renderCards();
    }

    function applyFilters() {
      renderCards();
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderCards();
    });
  </script>
</body>
</html>
